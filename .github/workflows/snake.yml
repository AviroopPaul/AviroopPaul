# .github/workflows/snake.yml
#
# Renders the real contribution grid to the "output" branch twice a day, once
# per theme, using the portfolio's ledger palette rather than the stock greens:
# paper-to-signal-orange in light, near-black-to-orange in dark, with the snake
# itself drawn in ink so it reads as a pen moving over the page.
#
# "#" has to be percent-encoded in these query strings.

name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Render the contribution grid
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23151513&color_dots=%23ebe8df,%23f7cfc2,%23f0a58e,%23e97a54,%23e2481c
            dist/snake-dark.svg?color_snake=%23f1efe9&color_dots=%23161619,%235a2a1a,%2394421f,%23c85529,%23ff6a3d

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
